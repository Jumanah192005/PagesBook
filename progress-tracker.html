<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متتبع الإنجاز</title>
<style>
  :root{
    --ink-950:#0f1f24;
    --ink-900:#16292f;
    --ink-800:#20393f;
    --parchment:#f8f2e2;
    --parchment-line:#e4d6b0;
    --gold:#c8963d;
    --gold-light:#e8c877;
    --gold-deep:#8a6423;
    --text-ink:#243138;
    --text-muted:#5c6b68;
    --danger:#a8452f;
    --corner-opacity:0.35;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.045) 1px, transparent 0) 0 0/24px 24px,
      radial-gradient(ellipse at top, var(--ink-800), var(--ink-950) 72%);
    font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
    color:var(--text-ink);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:clamp(20px,5vw,56px) clamp(14px,3vw,24px);
  }

  .container{ width:100%; max-width:640px; }

  .card{
    position:relative;
    background:var(--parchment);
    border:1px solid var(--parchment-line);
    border-radius:10px;
    padding:clamp(24px,5vw,44px);
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .card::before{
    content:'';
    position:absolute;
    inset:10px;
    border:1px solid var(--gold);
    border-radius:6px;
    opacity:.45;
    pointer-events:none;
  }

  .corner{
    position:absolute;
    width:26px; height:26px;
    color:var(--gold);
    opacity:var(--corner-opacity);
    transition:opacity .5s ease;
    pointer-events:none;
  }
  .corner svg{ width:100%; height:100%; display:block; }
  .corner.tl{ top:6px; right:6px; }
  .corner.tr{ top:6px; left:6px; transform:scaleX(-1); }
  .corner.bl{ bottom:6px; right:6px; transform:scaleY(-1); }
  .corner.br{ bottom:6px; left:6px; transform:scale(-1,-1); }

  .card.complete .corner{ animation:glow 2.2s ease-in-out infinite; }

  @keyframes glow{
    0%,100%{ opacity:.55; filter:drop-shadow(0 0 0 rgba(200,150,60,0)); }
    50%{ opacity:1; filter:drop-shadow(0 0 5px rgba(200,150,60,.8)); }
  }

  .hidden{ display:none; }

  .eyebrow{
    font-size:.78rem;
    letter-spacing:.06em;
    color:var(--gold-deep);
    font-weight:700;
    margin-bottom:.4rem;
  }

  h1.title{
    font-family:'Amiri','Traditional Arabic',serif;
    font-size:clamp(1.6rem,4vw,2.1rem);
    margin:0 0 .3rem;
    color:var(--ink-950);
  }

  .lede{
    color:var(--text-muted);
    font-size:.95rem;
    line-height:1.7;
    margin:0 0 1.8rem;
  }

  /* شاشة القائمة الرئيسية */
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:.6rem;
  }

  .goals-list{
    display:flex;
    flex-direction:column;
    gap:.75rem;
    margin-bottom:1.8rem;
  }

  .goal-card{
    background:#fff;
    border:1px solid var(--parchment-line);
    border-radius:8px;
    padding:.9rem 1rem;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .goal-card:hover{ border-color:var(--gold); transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.08); }
  .goal-card:focus-visible{ outline:2px solid var(--gold-deep); outline-offset:2px; }

  .goal-card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:.5rem;
    margin-bottom:.55rem;
  }
  .goal-card-name{
    font-weight:700;
    font-size:1rem;
    color:var(--ink-950);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .goal-card-meta{
    font-size:.78rem;
    color:var(--text-muted);
    margin-top:.45rem;
  }

  .icon-btn{
    flex-shrink:0;
    width:24px; height:24px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-size:1.05rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{ background:rgba(168,69,47,.12); color:var(--danger); }
  .icon-btn:focus-visible{ outline:2px solid var(--gold-deep); outline-offset:2px; }

  .empty-state{
    text-align:center;
    color:var(--text-muted);
    font-size:.92rem;
    padding:1.6rem 0;
    margin-bottom:1rem;
  }

  .field{ margin-bottom:1.4rem; }
  .field label{
    display:block;
    font-size:.85rem;
    color:var(--text-muted);
    margin-bottom:.4rem;
  }
  .field input{
    width:100%;
    border:none;
    border-bottom:2px solid var(--parchment-line);
    background:transparent;
    padding:.55rem .2rem;
    font-family:'Tajawal',sans-serif;
    font-size:1.05rem;
    color:var(--text-ink);
    transition:border-color .2s;
  }
  .field input:focus{ outline:none; border-bottom-color:var(--gold); }

  .error-text{
    color:var(--danger);
    font-size:.82rem;
    min-height:1.2em;
    margin-top:-.6rem;
    margin-bottom:1rem;
  }

  .btn-primary{
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    color:var(--ink-950);
    border:none;
    padding:.8rem 1.7rem;
    border-radius:6px;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(140,100,30,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(140,100,30,.42); }
  .btn-primary:focus-visible{ outline:3px solid var(--gold-light); outline-offset:2px; }
  .btn-primary.btn-sm{ padding:.55rem 1.1rem; font-size:.9rem; }
  .btn-primary.btn-block{ width:100%; }

  .btn-text{
    background:none;
    border:none;
    color:var(--text-muted);
    text-decoration:underline;
    text-underline-offset:3px;
    font-family:'Tajawal',sans-serif;
    font-size:.85rem;
    cursor:pointer;
    padding:.2rem;
  }
  .btn-text:hover{ color:var(--gold-deep); }
  .btn-text:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .btn-text.danger-text:hover{ color:var(--danger); }

  .nav-actions{ display:flex; align-items:center; gap:1rem; }

  .confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,31,36,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .confirm-overlay.hidden{ display:none; }
  .confirm-box{
    background:var(--parchment);
    border:1px solid var(--parchment-line);
    border-radius:10px;
    padding:1.6rem;
    max-width:360px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:fadeIn .2s ease;
  }
  .confirm-message{
    margin:0 0 1.4rem;
    color:var(--text-ink);
    font-size:.95rem;
    line-height:1.7;
    text-align:center;
  }
  .confirm-actions{
    display:flex;
    justify-content:center;
    gap:1rem;
  }

  h2.tracker-title{
    font-family:'Amiri','Traditional Arabic',serif;
    font-size:clamp(1.3rem,3.6vw,1.7rem);
    margin:.4rem 0 1.4rem;
    color:var(--ink-950);
    line-height:1.4;
  }

  .progress-wrap{ margin-bottom:1.6rem; }
  .progress-percent{
    text-align:center;
    font-weight:700;
    color:var(--gold-deep);
    font-size:1rem;
    margin-bottom:.5rem;
  }
  .progress-track{
    position:relative;
    height:10px;
    background:var(--parchment-line);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-track.mini{ height:6px; }
  .progress-fill{
    position:absolute;
    inset-inline-start:0;
    top:0; bottom:0;
    width:0%;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-light));
    border-radius:3px;
    transition:width .5s ease;
  }

  .stats{
    display:flex;
    justify-content:space-around;
    text-align:center;
    margin:1.4rem 0;
    padding:1rem 0;
    border-top:1px solid var(--parchment-line);
    border-bottom:1px solid var(--parchment-line);
  }
  .stat span{
    display:block;
    font-size:1.3rem;
    font-weight:700;
    color:var(--ink-950);
  }
  .stat label{
    font-size:.78rem;
    color:var(--text-muted);
  }

  .quick-select{
    display:flex;
    align-items:center;
    gap:.7rem;
    margin-bottom:1.6rem;
  }
  .quick-select label{
    font-size:.85rem;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .quick-select input{
    width:5rem;
    border:none;
    border-bottom:2px solid var(--parchment-line);
    background:transparent;
    padding:.45rem .2rem;
    font-family:'Tajawal',sans-serif;
    font-size:1rem;
    color:var(--text-ink);
    text-align:center;
  }
  .quick-select input:focus{ outline:none; border-bottom-color:var(--gold); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));
    gap:7px;
  }
  .cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:1px solid var(--parchment-line);
    border-radius:4px;
    font-family:'Tajawal',sans-serif;
    font-weight:600;
    font-size:clamp(.6rem,2vw,.8rem);
    color:var(--text-muted);
    cursor:pointer;
    user-select:none;
    transition:background .2s, color .2s, border-color .2s, transform .15s;
  }
  .cell:hover{ border-color:var(--gold); transform:translateY(-1px); }
  .cell:focus-visible{ outline:2px solid var(--gold-deep); outline-offset:2px; }
  .cell.done{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:var(--ink-950);
    border-color:var(--gold-deep);
    box-shadow:0 2px 6px rgba(140,100,30,.35);
  }
  .cell.pop{ animation:pop .26s ease; }
  @keyframes pop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }

  .celebration{
    margin-top:1.6rem;
    text-align:center;
    font-family:'Amiri','Traditional Arabic',serif;
    font-size:1.15rem;
    color:var(--gold-deep);
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .footnote{
    margin-top:1.6rem;
    text-align:center;
    font-size:.75rem;
    color:var(--text-muted);
  }

  @media (max-width:420px){
    .grid{ grid-template-columns:repeat(auto-fill,minmax(34px,1fr)); gap:5px; }
    .quick-select{ flex-wrap:wrap; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- الشاشة الرئيسية: قائمة الأهداف -->
  <div id="homeScreen" class="card">
    <div class="corner tl" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner tr" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner bl" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner br" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>

    <div class="eyebrow">صفحة بصفحة، هدف بهدف</div>
    <h1 class="title">متتبع الإنجاز</h1>
    <p class="lede">أهدافك وكتبك في مكان واحد. اضغطي على أي هدف لمتابعة تقدمك، أو أضيفي هدفاً جديداً.</p>

    <div id="goalsList" class="goals-list"></div>
    <div id="emptyState" class="empty-state hidden">ما عندك أهداف بعد. ابدئي بإضافة أول هدف! ✦</div>

    <button id="addGoalBtn" class="btn-primary btn-block">+ هدف جديد</button>
  </div>

  <!-- شاشة إنشاء هدف -->
  <div id="formScreen" class="card hidden">
    <div class="corner tl" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner tr" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner bl" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner br" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>

    <div class="nav-row">
      <button id="cancelFormBtn" class="btn-text">→ الرئيسية</button>
    </div>
    <h1 id="formTitle" class="title" style="margin-top:.8rem;">هدف جديد</h1>
    <p id="formLede" class="lede">اكتب اسم هدفك وعدد وحداته لإنشاء شبكة الإنجاز.</p>

    <div class="field">
      <label for="goalName">اسم الهدف أو الكتاب</label>
      <input type="text" id="goalName" placeholder="مثال: كتاب الذكاء الاصطناعي">
    </div>
    <div class="field">
      <label for="totalUnits">العدد الإجمالي للوحدات أو الصفحات</label>
      <input type="number" id="totalUnits" min="1" placeholder="مثال: 64">
    </div>
    <div id="setupError" class="error-text"></div>
    <button id="generateBtn" class="btn-primary btn-block">إنشاء شبكة الإنجاز</button>
  </div>

  <!-- شاشة المتابعة لهدف محدد -->
  <div id="trackerCard" class="card hidden">
    <div class="corner tl" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner tr" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner bl" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>
    <div class="corner br" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M2 42 C2 20 20 2 42 2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M10 42 C10 26 26 10 42 10" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="42" cy="2" r="2.4" fill="currentColor"/><circle cx="2" cy="42" r="2.4" fill="currentColor"/></svg></div>

    <div class="nav-row">
      <button id="backHomeBtn" class="btn-text">→ الرئيسية</button>
      <div class="nav-actions">
        <button id="editGoalBtn" class="btn-text">تعديل</button>
        <button id="deleteGoalBtn" class="btn-text danger-text">حذف الهدف</button>
      </div>
    </div>
    <h2 id="goalTitle" class="tracker-title"></h2>

    <div class="progress-wrap">
      <div id="progressPercent" class="progress-percent">0%</div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span id="statDone">0</span><label>منجز</label></div>
      <div class="stat"><span id="statRemaining">0</span><label>متبقي</label></div>
      <div class="stat"><span id="statTotal">0</span><label>الإجمالي</label></div>
    </div>

    <div class="quick-select">
      <label for="quickNum">تحديد سريع حتى رقم:</label>
      <input type="number" id="quickNum" min="0" placeholder="مثلاً 6">
      <button id="quickBtn" class="btn-primary btn-sm">تحديد</button>
    </div>
    <div id="quickError" class="error-text"></div>

    <div id="grid" class="grid"></div>

    <div id="celebration" class="celebration hidden">
      <span id="celebrationText"></span>
    </div>

    <div class="footnote">يُحفظ تقدمك تلقائياً في هذا المتصفح.</div>
  </div>

</div>

<div id="confirmOverlay" class="confirm-overlay hidden">
  <div class="confirm-box">
    <p id="confirmMessage" class="confirm-message"></p>
    <div class="confirm-actions">
      <button id="confirmCancelBtn" class="btn-text">إلغاء</button>
      <button id="confirmOkBtn" class="btn-primary btn-sm">حذف نهائياً</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'goalProgressTrackerV2';
  const OLD_STORAGE_KEY = 'goalProgressTrackerV1';
  const MAX_UNITS = 3000;
  const MAX_GOALS = 40;

  const homeScreen = document.getElementById('homeScreen');
  const goalsList = document.getElementById('goalsList');
  const emptyState = document.getElementById('emptyState');
  const addGoalBtn = document.getElementById('addGoalBtn');

  const formScreen = document.getElementById('formScreen');
  const formTitle = document.getElementById('formTitle');
  const formLede = document.getElementById('formLede');
  const cancelFormBtn = document.getElementById('cancelFormBtn');
  const goalNameInput = document.getElementById('goalName');
  const totalUnitsInput = document.getElementById('totalUnits');
  const generateBtn = document.getElementById('generateBtn');
  const setupError = document.getElementById('setupError');

  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMessage = document.getElementById('confirmMessage');
  const confirmCancelBtn = document.getElementById('confirmCancelBtn');
  const confirmOkBtn = document.getElementById('confirmOkBtn');

  let editingId = null; // null = وضع إنشاء هدف جديد، غير ذلك = تعديل هدف موجود

  const trackerCard = document.getElementById('trackerCard');
  const backHomeBtn = document.getElementById('backHomeBtn');
  const editGoalBtn = document.getElementById('editGoalBtn');
  const deleteGoalBtn = document.getElementById('deleteGoalBtn');
  const goalTitle = document.getElementById('goalTitle');
  const progressFill = document.getElementById('progressFill');
  const progressPercent = document.getElementById('progressPercent');
  const statDone = document.getElementById('statDone');
  const statRemaining = document.getElementById('statRemaining');
  const statTotal = document.getElementById('statTotal');
  const quickNum = document.getElementById('quickNum');
  const quickBtn = document.getElementById('quickBtn');
  const quickError = document.getElementById('quickError');
  const grid = document.getElementById('grid');
  const celebration = document.getElementById('celebration');
  const celebrationText = document.getElementById('celebrationText');

  let appState = { goals: [], activeId: null };

  function storageAvailable(){
    try{
      window.localStorage.setItem('__storage_test__', '1');
      window.localStorage.removeItem('__storage_test__');
      return true;
    }catch(e){
      return false;
    }
  }
  const hasStorage = storageAvailable();

  function genId(){
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7);
  }

  function loadAppState(){
    if(!hasStorage) return { goals: [], activeId: null };
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.goals)) return parsed;
      }
      // ترحيل تلقائي من نسخة سابقة كانت تدعم هدفاً واحداً فقط
      const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
      if(oldRaw){
        const old = JSON.parse(oldRaw);
        if(old && typeof old.total === 'number' && Array.isArray(old.completed)){
          const migrated = {
            goals: [{ id: genId(), name: old.goalName || 'هدف', total: old.total, completed: old.completed }],
            activeId: null
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          localStorage.removeItem(OLD_STORAGE_KEY);
          return migrated;
        }
      }
    }catch(e){}
    return { goals: [], activeId: null };
  }

  function saveAppState(){
    if(!hasStorage) return;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); }catch(e){}
  }

  function getActiveGoal(){
    return appState.goals.find(function(g){ return g.id === appState.activeId; }) || null;
  }

  let pendingConfirmAction = null;

  function askConfirm(message, onConfirm){
    confirmMessage.textContent = message;
    pendingConfirmAction = onConfirm;
    confirmOverlay.classList.remove('hidden');
  }

  function closeConfirm(){
    confirmOverlay.classList.add('hidden');
    pendingConfirmAction = null;
  }

  confirmCancelBtn.addEventListener('click', closeConfirm);
  confirmOkBtn.addEventListener('click', function(){
    const action = pendingConfirmAction;
    closeConfirm();
    if(action) action();
  });
  confirmOverlay.addEventListener('click', function(e){
    if(e.target === confirmOverlay) closeConfirm();
  });

  function showScreen(name){
    homeScreen.classList.toggle('hidden', name !== 'home');
    formScreen.classList.toggle('hidden', name !== 'form');
    trackerCard.classList.toggle('hidden', name !== 'tracker');
  }

  function renderHome(){
    goalsList.innerHTML = '';
    if(appState.goals.length === 0){
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');
    appState.goals.forEach(function(g){
      const done = g.completed.filter(Boolean).length;
      const percent = g.total > 0 ? (done/g.total*100) : 0;
      const percentDisplay = Math.round(percent*10)/10;

      const card = document.createElement('div');
      card.className = 'goal-card';
      card.dataset.id = g.id;
      card.setAttribute('role','button');
      card.setAttribute('tabindex','0');

      const top = document.createElement('div');
      top.className = 'goal-card-top';

      const nameEl = document.createElement('span');
      nameEl.className = 'goal-card-name';
      nameEl.textContent = g.name;

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.type = 'button';
      delBtn.setAttribute('aria-label', 'حذف الهدف');
      delBtn.textContent = '×';
      delBtn.dataset.action = 'delete';
      delBtn.dataset.id = g.id;

      top.appendChild(nameEl);
      top.appendChild(delBtn);

      const track = document.createElement('div');
      track.className = 'progress-track mini';
      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      fill.style.width = percent + '%';
      track.appendChild(fill);

      const meta = document.createElement('div');
      meta.className = 'goal-card-meta';
      meta.textContent = done + ' / ' + g.total + ' — ' + percentDisplay + '%';

      card.appendChild(top);
      card.appendChild(track);
      card.appendChild(meta);
      goalsList.appendChild(card);
    });
  }

  function buildGrid(g){
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();
    for(let i=0;i<g.total;i++){
      const cell = document.createElement('div');
      cell.className = 'cell' + (g.completed[i] ? ' done' : '');
      cell.textContent = i+1;
      cell.setAttribute('role','button');
      cell.setAttribute('tabindex','0');
      cell.setAttribute('aria-pressed', g.completed[i] ? 'true' : 'false');
      cell.dataset.index = i;
      frag.appendChild(cell);
    }
    grid.appendChild(frag);
  }

  function updateProgress(){
    const g = getActiveGoal();
    if(!g) return;
    const done = g.completed.filter(Boolean).length;
    const total = g.total;
    const remaining = total - done;
    const percent = total > 0 ? (done/total*100) : 0;
    const percentDisplay = Math.round(percent*10)/10;

    progressFill.style.width = percent + '%';
    progressPercent.textContent = percentDisplay + '%';
    statDone.textContent = done;
    statRemaining.textContent = remaining;
    statTotal.textContent = total;

    const opacity = 0.25 + (percent/100)*0.75;
    trackerCard.style.setProperty('--corner-opacity', opacity.toFixed(2));

    if(total > 0 && done === total){
      trackerCard.classList.add('complete');
      celebrationText.textContent = '✦ أتممت "' + g.name + '" بالكامل. إنجاز رائع! ✦';
      celebration.classList.remove('hidden');
    } else {
      trackerCard.classList.remove('complete');
      celebration.classList.add('hidden');
    }
  }

  function openGoal(id){
    appState.activeId = id;
    saveAppState();
    const g = getActiveGoal();
    if(!g){ showScreen('home'); renderHome(); return; }
    goalTitle.textContent = g.name;
    buildGrid(g);
    updateProgress();
    showScreen('tracker');
  }

  function toggleCell(i){
    const g = getActiveGoal();
    if(!g) return;
    g.completed[i] = !g.completed[i];
    saveAppState();
    const cellEl = grid.children[i];
    cellEl.classList.toggle('done', g.completed[i]);
    cellEl.setAttribute('aria-pressed', g.completed[i] ? 'true' : 'false');
    cellEl.classList.add('pop');
    setTimeout(function(){ cellEl.classList.remove('pop'); }, 260);
    updateProgress();
  }

  // فتح شاشة إنشاء هدف جديد
  addGoalBtn.addEventListener('click', function(){
    editingId = null;
    formTitle.textContent = 'هدف جديد';
    formLede.textContent = 'اكتب اسم هدفك وعدد وحداته لإنشاء شبكة الإنجاز.';
    generateBtn.textContent = 'إنشاء شبكة الإنجاز';
    goalNameInput.value = '';
    totalUnitsInput.value = '';
    setupError.textContent = '';
    showScreen('form');
    goalNameInput.focus();
  });

  // فتح شاشة تعديل هدف موجود
  function openEditForm(g){
    editingId = g.id;
    formTitle.textContent = 'تعديل الهدف';
    formLede.textContent = 'عدّلي الاسم أو العدد الإجمالي، وسيتم الحفاظ على تقدمك المنجز قدر الإمكان.';
    generateBtn.textContent = 'حفظ التعديلات';
    goalNameInput.value = g.name;
    totalUnitsInput.value = g.total;
    setupError.textContent = '';
    showScreen('form');
    goalNameInput.focus();
  }

  editGoalBtn.addEventListener('click', function(){
    const g = getActiveGoal();
    if(!g) return;
    openEditForm(g);
  });

  cancelFormBtn.addEventListener('click', function(){
    if(editingId){
      const id = editingId;
      editingId = null;
      openGoal(id);
    } else {
      showScreen('home');
    }
  });

  goalNameInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ totalUnitsInput.focus(); } });
  totalUnitsInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ generateBtn.click(); } });

  generateBtn.addEventListener('click', function(){
    const name = goalNameInput.value.trim();
    const totalRaw = totalUnitsInput.value.trim();
    const total = parseInt(totalRaw, 10);

    if(!name){
      setupError.textContent = 'رجاءً اكتب اسم الهدف أو الكتاب.';
      goalNameInput.focus();
      return;
    }
    if(!totalRaw || isNaN(total) || total <= 0){
      setupError.textContent = 'رجاءً أدخل عدد وحدات صحيح أكبر من صفر.';
      totalUnitsInput.focus();
      return;
    }
    if(total > MAX_UNITS){
      setupError.textContent = 'الحد الأقصى المسموح ' + MAX_UNITS + ' وحدة.';
      totalUnitsInput.focus();
      return;
    }

    if(editingId){
      const g = appState.goals.find(function(x){ return x.id === editingId; });
      if(!g){
        editingId = null;
        setupError.textContent = '';
        showScreen('home');
        renderHome();
        return;
      }
      g.name = name;
      if(g.total !== total){
        const oldCompleted = g.completed;
        const newCompleted = new Array(total).fill(false);
        const copyLen = Math.min(oldCompleted.length, total);
        for(let i=0;i<copyLen;i++){ newCompleted[i] = oldCompleted[i]; }
        g.completed = newCompleted;
        g.total = total;
      }
      setupError.textContent = '';
      saveAppState();
      const idToOpen = editingId;
      editingId = null;
      openGoal(idToOpen);
      return;
    }

    if(appState.goals.length >= MAX_GOALS){
      setupError.textContent = 'وصلتِ للحد الأقصى لعدد الأهداف (' + MAX_GOALS + ').';
      return;
    }
    setupError.textContent = '';

    const newGoal = { id: genId(), name: name, total: total, completed: new Array(total).fill(false) };
    appState.goals.push(newGoal);
    openGoal(newGoal.id);
  });

  backHomeBtn.addEventListener('click', function(){
    appState.activeId = null;
    saveAppState();
    renderHome();
    showScreen('home');
  });

  deleteGoalBtn.addEventListener('click', function(){
    const g = getActiveGoal();
    if(!g) return;
    askConfirm('هل تريدين حذف "' + g.name + '" نهائياً؟ لا يمكن التراجع.', function(){
      appState.goals = appState.goals.filter(function(x){ return x.id !== g.id; });
      appState.activeId = null;
      saveAppState();
      renderHome();
      showScreen('home');
    });
  });

  goalsList.addEventListener('click', function(e){
    const delBtn = e.target.closest('[data-action="delete"]');
    if(delBtn){
      e.stopPropagation();
      const id = delBtn.dataset.id;
      const g = appState.goals.find(function(x){ return x.id === id; });
      if(!g) return;
      askConfirm('هل تريدين حذف "' + g.name + '" نهائياً؟', function(){
        appState.goals = appState.goals.filter(function(x){ return x.id !== id; });
        if(appState.activeId === id) appState.activeId = null;
        saveAppState();
        renderHome();
      });
      return;
    }
    const card = e.target.closest('.goal-card');
    if(card){ openGoal(card.dataset.id); }
  });
  goalsList.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      const card = e.target.closest('.goal-card');
      if(card){ e.preventDefault(); openGoal(card.dataset.id); }
    }
  });

  grid.addEventListener('click', function(e){
    const cell = e.target.closest('.cell');
    if(!cell) return;
    toggleCell(parseInt(cell.dataset.index, 10));
  });
  grid.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      const cell = e.target.closest('.cell');
      if(!cell) return;
      e.preventDefault();
      toggleCell(parseInt(cell.dataset.index, 10));
    }
  });

  quickBtn.addEventListener('click', function(){
    const g = getActiveGoal();
    if(!g) return;
    const raw = quickNum.value.trim();
    const n = parseInt(raw, 10);
    if(raw === '' || isNaN(n) || n < 0){
      quickError.textContent = 'أدخل رقماً صحيحاً صفر أو أكبر.';
      return;
    }
    const clamped = Math.min(n, g.total);
    quickError.textContent = '';
    g.completed = g.completed.map(function(_, idx){ return idx < clamped; });
    saveAppState();
    buildGrid(g);
    updateProgress();
    quickNum.value = '';
  });
  quickNum.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ quickBtn.click(); } });

  // التهيئة الأولية — نبدأ دائماً من الشاشة الرئيسية
  appState = loadAppState();
  appState.activeId = null;
  renderHome();
  showScreen('home');
})();
</script>
</body>
</html>
